name: C CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC
      run: sudo apt update && sudo apt install -y gcc

    - name: Compile Rock Paper Scissors
      run: gcc rps.c -o rps

    - name: Run the program (optional)
      run: ./rps < /dev/null || true
